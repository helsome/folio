name: Desktop installers

on:
  workflow_call:
    inputs:
      release_gates:
        description: Run existing golden-path and v5 gates with real provider prerequisites
        type: boolean
        default: false
    secrets:
      FINAGENT_ENV_FILE_CONTENT:
        required: false
      APPLE_CERTIFICATE_BASE64:
        required: false
      APPLE_CERT_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    name: ${{ matrix.platform }} ${{ matrix.arch }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      FINAGENT_BUILD_SHA: ${{ github.sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      FOLIO_RELEASE_GATES: ${{ inputs.release_gates && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Verify native runner architecture
        run: node -e "if (process.platform !== '${{ matrix.platform }}' || process.arch !== '${{ matrix.arch }}') process.exit(1)"
      - run: bun install --frozen-lockfile
      - name: Install pinned Longbridge CLI for trusted release gates
        if: inputs.release_gates && startsWith(github.ref, 'refs/tags/v')
        run: node scripts/install-longbridge.mjs
      - name: Verify existing release provider credentials and real quote access
        if: inputs.release_gates
        run: node scripts/release-provider-check.mjs
        env:
          FINAGENT_ENV_FILE_CONTENT: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.FINAGENT_ENV_FILE_CONTENT || '' }}
      - name: Build native installer (publishing disabled; Apple signing opt-in)
        run: node scripts/release-package.mjs
        env:
          FOLIO_ALLOW_APPLE_SIGNING: ${{ inputs.release_gates && startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          APPLE_CERTIFICATE_BASE64: ${{ inputs.release_gates && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE_BASE64 || '' }}
          APPLE_CERT_PASSWORD: ${{ inputs.release_gates && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.release_gates && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.release_gates && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.release_gates && startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
      - name: Install, inspect and launch distributed app outside repository
        run: node scripts/verify-installer.mjs
        env:
          FINAGENT_ENV_FILE_CONTENT: ${{ inputs.release_gates && startsWith(github.ref, 'refs/tags/v') && secrets.FINAGENT_ENV_FILE_CONTENT || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
