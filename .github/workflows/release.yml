name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (must point to this selected commit, e.g. v0.4.0-beta.3)'
        required: true
        type: string
      formal_apple_signing:
        description: Optional Developer ID signing/notarization using existing Apple secrets
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version, tag ancestry and unused release
        id: tag
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const tag = process.env.REQUESTED_TAG;
            const version = JSON.parse(fs.readFileSync('package.json')).version;
            const appVersion = JSON.parse(fs.readFileSync('apps/electron/package.json')).version;
            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$/.test(tag) || tag !== `v${version}` || version !== appVersion) {
              throw new Error('Tag and both package versions must match');
            }
            if (context.ref !== `refs/tags/${tag}`) throw new Error(`Select refs/tags/${tag} for dispatch; a branch at the same SHA is not a release ref`);
            const sha = execFileSync('git', ['rev-parse', `${tag}^{commit}`], {encoding:'utf8'}).trim();
            if (sha !== context.sha) throw new Error('The selected tag must point to the workflow commit');
            execFileSync('git', ['merge-base', '--is-ancestor', sha, 'origin/main']);
            try {
              await github.rest.repos.getReleaseByTag({...context.repo, tag});
              throw new Error('Release already exists; choose a new version. Existing releases are never overwritten.');
            } catch (e) { if (e.status !== 404) throw e; }
            core.setOutput('tag', tag);
  quality:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: node scripts/secret-scan.mjs
      - run: bun test --isolate
      - run: bun run typecheck
      - run: bun run i18n:check
      - run: bun run build
  desktop:
    needs: preflight
    uses: ./.github/workflows/desktop.yml
    with:
      release_gates: true
      formal_apple_signing: ${{ inputs.formal_apple_signing || false }}
    # Only trusted tag/manual runs pass existing secrets; PR/main callers pass none.
    secrets:
      FINAGENT_ENV_FILE_CONTENT: ${{ secrets.FINAGENT_ENV_FILE_CONTENT }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  publish:
    needs: [preflight, quality, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/release
          merge-multiple: true
      - name: Recheck complete asset set, commit identity and SHA256
        run: node scripts/verify-release.mjs
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          FINAGENT_BUILD_SHA: ${{ github.sha }}
      - name: Stage all assets as draft, then publish prerelease atomically
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = process.env.RELEASE_TAG;
            const manifests = fs.readdirSync('dist/release').filter(n => n.startsWith('manifest-')).map(n => JSON.parse(fs.readFileSync(path.join('dist/release', n))));
            const signing = manifests.map(m => `${m.platform}/${m.arch}: ${m.signing}; notarized=${m.notarized}`).join('\n');
            let release;
            try {
              release = (await github.rest.repos.createRelease({...context.repo, tag_name: tag,
                name: `Folio ${tag} — internal preview`, target_commitish: context.sha,
                draft: true, prerelease: true, make_latest: 'false',
                body: `Build: ${context.sha}\n\nInternal testing preview: macOS arm64 + x64 DMG and Windows x64 NSIS EXE. Signature verification results:\n${signing}\nDefault macOS signatures are ad-hoc, not Developer ID, and have no Apple notarization. Windows uses an ephemeral self-signed Authenticode certificate: file integrity is verified, but the publisher is not trusted. No certificate is installed into system trust stores and no private key is persisted or exported. Optional macOS Developer ID/notarization is claimed only after codesign, stapler and spctl verification. Gatekeeper/SmartScreen may block execution. No bypass of OS security is recommended. Not a stable release; self-signing establishes integrity, not publisher trust. This remains an internal testing preview.\n\nAll three installers were installed/mounted and their architecture, bundled resources, startup, local agent, first launch, golden path and v5 gates verified on native runners. These product checks do not establish full nightly live LLM/judge evaluation success.\n\nSHA256SUMS.txt and per-platform validation reports are attached.`
              })).data;
              for (const name of fs.readdirSync('dist/release').sort()) {
                const data = fs.readFileSync(path.join('dist/release', name));
                await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id, name, data,
                  headers: {'content-type':'application/octet-stream', 'content-length': data.length}});
              }
              const uploaded = await github.paginate(github.rest.repos.listReleaseAssets, {...context.repo, release_id: release.id});
              const local = fs.readdirSync('dist/release');
              if (uploaded.length !== local.length || uploaded.some(a => a.state !== 'uploaded' || a.size !== fs.statSync(path.join('dist/release',a.name)).size)) {
                throw new Error('Incomplete release upload');
              }
              await github.rest.repos.updateRelease({...context.repo, release_id:release.id, draft:false, prerelease:true, make_latest:'false'});
            } catch (error) {
              if (release) await github.rest.repos.deleteRelease({...context.repo, release_id:release.id});
              throw error;
            }
