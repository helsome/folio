name: PR checks

# PR 只阻塞高信号检查：类型、变更工作区测试、Secret Scan。
# 全仓测试在 PR 和 main 上都是硬门禁。
# PR/main 验证原生安装包与离线启动；真实外部评测与产品 E2E 发布门禁保持独立。

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'artifacts/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'artifacts/**'

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # 固定已在当前 main 验证通过的版本，避免 latest 漂移导致随机 CI 回归。
  BUN_VERSION: '1.4.2'

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Check i18n parity
        run: bun run i18n:check
      - name: Build application
        run: bun run build

  focused-tests:
    name: Focused tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests for changed workspaces
        shell: bash
        run: |
          set -euo pipefail

          BASE='${{ github.event.pull_request.base.sha }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          git diff --name-only "$BASE" "$HEAD" > /tmp/changed-files.txt

          echo 'Changed files:'
          cat /tmp/changed-files.txt

          mapfile -t TARGETS < <(
            awk -F/ '
              /^packages\/[^/]+\// { print $1 "/" $2 }
              /^apps\/electron\// { print "apps/electron" }
            ' /tmp/changed-files.txt | sort -u
          )

          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo 'No package/app workspace changed; skipping focused tests.'
            exit 0
          fi

          for target in "${TARGETS[@]}"; do
            if find "$target" -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) -print -quit | grep -q .; then
              echo "::group::bun test $target"
              bun test "$target" --isolate
              echo '::endgroup::'
            else
              echo "$target has no detected test files; skipping."
            fi
          done

  full-unit-pr:
    name: Full unit tests (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run full unit suite
        run: bun test --isolate

  full-unit-main:
    name: Full unit tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run full unit suite
        run: bun test --isolate

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan for high-signal secret patterns
        run: node scripts/secret-scan.mjs

  desktop:
    name: Native desktop build and installer verification
    uses: ./.github/workflows/desktop.yml
